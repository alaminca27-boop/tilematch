.pt{position:fixed;z-index:2001;pointer-events:none;font-size:20px;transition:transform .6s ease-out,opacity .6s}
.cf{position:fixed;top:-30px;z-index:2001;pointer-events:none;font-size:22px;animation:fall linear forwards}

#mpb{padding:5px 9px;font-size:1rem}

  while(mNext<AC.currentTime+.7){
    const s=mStep%32,ch=CH[s>>3],st=s%8,pat=(mStep>>5)%2?AQ:AP,tones=[ch[0],ch[1],ch[2],ch[0]+12];

  $('mu').onclick=()=>{mus=!mus;try{localStorage.setItem('tm_mus',mus?1:0)}catch(x){}openSet()};
  $('vb').onclick=()=>{vib=!vib;try{localStorage.setItem('tm_vib',vib?1:0)}catch(x){}if(vib)vb(30);openSet()};
  $('ht').onclick=()=>{m.style.display='none';$('map').style.display='none';tutOn=true;tutSeq=false;lv=1;start()};
  $('rp').onclick=()=>{if(!$('rp').dataset.s){$('rp').dataset.s=1;$('rp').textContent=L().confirm;return}
    try{['tm_lv','tm_c','tm_st','tm_d','tm_tut','tm_stat','tm_dm','tm_sp'].forEach(k=>localStorage.removeItem(k))}catch(x){}
    STAT={matches:0,levels:0,bombs:0,ice:0,claimed:{}};DM={};tutOn=true;lv=1;maxLv=1;coins=150;saveC();m.style.display='none';start();showMap(0)};
  $('cl').onclick=()=>{m.style.display='none'};
}
$('sn').onclick=openSet;
function J(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}}
function Sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let STAT=Object.assign({matches:0,levels:0,bombs:0,ice:0,claimed:{}},J('tm_stat',{})),DM=J('tm_dm',{});
const starsTotal=()=>Object.values(J('tm_st',{})).reduce((a,b)=>a+b,0);
const DMS=[{k:'m',n:15,r:30,t:'dm1'},{k:'l',n:2,r:40,t:'dm2'},{k:'s',n:3,r:50,t:'dm3'}];
const ACH=[
 {id:'a1',get:()=>STAT.levels,n:1,r:20,t:'ac1'},{id:'a2',get:()=>STAT.levels,n:10,r:100,t:'ac2'},
 {id:'a3',get:()=>STAT.matches,n:100,r:50,t:'ac3'},{id:'a4',get:()=>STAT.matches,n:500,r:150,t:'ac4'},
 {id:'a5',get:starsTotal,n:30,r:100,t:'ac5'},{id:'a6',get:()=>STAT.ice,n:10,r:60,t:'ac6'},
 {id:'a7',get:()=>STAT.bombs,n:5,r:60,t:'ac7'},{id:'a8',get:()=>maxLv-1,n:30,r:200,t:'ac8'}];
function dayChk(){const d=new Date().toDateString();if(DM.d!==d)DM={d,m:0,l:0,s:0,c:{}}}
function claimable(){dayChk();let c=0;DMS.forEach(m=>{if(!DM.c[m.k]&&DM[m.k]>=m.n)c++});ACH.forEach(a=>{if(!STAT.claimed[a.id]&&a.get()>=a.n)c++});return c}
function bump(k,n=1){const b=claimable();STAT[k]=(STAT[k]||0)+n;Sv('tm_stat',STAT);dayChk();if(k==='matches')DM.m+=n;if(k==='levels')DM.l+=n;Sv('tm_dm',DM);if(claimable()>b)toast(L().mdone)}
function addStars(n){const b=claimable();dayChk();DM.s+=n;Sv('tm_dm',DM);if(claimable()>b)toast(L().mdone)}
function openMis(tab){
  tab=tab||'d';const M=$('mis');dayChk();
  const rows=tab==='d'?DMS.map(m=>({id:m.k,t:L()[m.t],cur:DM[m.k]||0,n:m.n,r:m.r,cl:!!DM.c[m.k]})):ACH.map(a=>({id:a.id,t:L()[a.t],cur:a.get(),n:a.n,r:a.r,cl:!!STAT.claimed[a.id]}));
  M.innerHTML=`<div><div class="tabs"><button class="${tab==='d'?'':'off'}" id="td">🎯 ${L().daily}</button><button class="${tab==='a'?'':'off'}" id="ta">🏆 ${L().ach}</button></div>`+
   rows.map(w=>{const c=Math.min(w.cur,w.n),ok=w.cur>=w.n;return `<div class="rw"><div class="rl">${w.t}<div class="pb"><i style="width:${c/w.n*100}%"></i></div><small>${bn(c)}/${bn(w.n)}</small></div><button data-id="${w.id}" ${w.cl||!ok?'disabled':''}>${w.cl?'✓':'🪙 '+bn(w.r)}</button></div>`}).join('')+`<button id="mx">${L().close}</button></div>`;
  M.style.display='flex';
  $('td').onclick=()=>openMis('d');$('ta').onclick=()=>openMis('a');
  $('mx').onclick=()=>{M.style.display='none';if($('map').style.display==='flex')showMap(mw)};
  M.querySelectorAll('.rw button').forEach(b=>b.onclick=()=>{
    const w=rows.find(x=>x.id===b.dataset.id);
    if(tab==='d')DM.c[w.id]=1;else STAT.claimed[w.id]=1;
    coins+=w.r;saveC();Sv('tm_dm',DM);Sv('tm_stat',STAT);sfx.coin();openMis(tab);
  });
}
let tutOn=true,tutSeq=false,tutId=0;
try{tutOn=!localStorage.getItem('tm_tut')}catch(e){}
const tileEl=t=>document.querySelector('[data-i="'+tiles.indexOf(t)+'"]');
function hideTut(){tutId++;tutSeq=false;$('tb').style.display='none';$('fg').style.display='none'}
function tutDone(){tutOn=false;try{localStorage.setItem('tm_tut',1)}catch(e){}hideTut()}
$('tbs').onclick=tutDone;
function showTut(msg,el,pos){
  $('tbt').textContent=msg;$('tbs').textContent=L().skip;$('tb').style.display='flex';
  const f=$('fg');
  if(el){const r=el.getBoundingClientRect();f.style.display='block';f.textContent=pos==='down'?'👇':'👆';f.style.left=(r.left+r.width/2-16)+'px';f.style.top=(pos==='down'?r.top-44:r.bottom-12)+'px'}
  else f.style.display='none';
}
function tutUpdate(){
  if(!tutOn||tutSeq||lv!==1||$('map').style.display==='flex'||$('m').style.display==='flex')return;
  const free=tiles.filter(t=>t.in&&!blocked(t));if(!free.length)return;
  const c={};tray.forEach(x=>c[x.t]=(c[x.t]||0)+1);
  if(Object.values(c).some(v=>v>=3)){$('fg').style.display='none';return}
  let ty;
  if(tray.length)ty=+Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
  else{const f={};free.forEach(x=>f[x.t]=(f[x.t]||0)+1);ty=+Object.keys(f).sort((a,b)=>f[b]-f[a])[0]}
  const tg=free.find(x=>x.t===ty)||free[0];
  showTut(tray.length?L().t1:L().t0,tileEl(tg),'up');
}
function tutAfterMatch(){
  tutSeq=true;const id=++tutId;
  const steps=[()=>{const b=tiles.find(t=>t.in&&blocked(t));return [L().t2,b&&tileEl(b),'up']},()=>[L().t3,$('tray'),'up'],()=>[L().t4,$('hn'),'down']];
  let k=0;
  const run=()=>{if(id!==tutId)return;if(k>=steps.length){tutDone();return}const [m,el,pos]=steps[k++]();showTut(m,el,pos);setTimeout(run,3800)};
  run();
}
let mw=0;
function showMap(w){
  hideTut();
  mw=w===undefined?Math.floor((lv-1)/10):w;
  const M=$('map'),P=$('mp');let st={};
  try{st=JSON.parse(localStorage.getItem('tm_st')||'{}')}catch(e){}
  M.className='th'+(mw%6);M.style.display='flex';
  $('wn').textContent=L().worlds[mw%6]+' · '+bn(mw*10+1)+'–'+bn(mw*10+10);
  $('pv').disabled=mw<=0;$('nx').disabled=mw>=9||maxLv<=(mw+1)*10;
  $('mcn').textContent='🪙 '+bn(coins);$('mi').textContent=claimable()?'🎯❗':'🎯';
  $('pl').textContent='▶ '+L().play+' '+bn(Math.min(maxLv,100));
  const xs=[50,24,62,80,48,22,46,78,56,50],emo=['🌳','🌵','🐚','⛄','🍭','🪐'][mw%6];
  let h='',pl='';
  for(let k=0;k<10;k++){
    const n=mw*10+k+1,x=xs[k],y=88-k*8.6,c=n<maxLv?'dn':n===maxLv?'cu':'lk',sc=st[n]||0;
    pl+=x+','+y+' ';
    h+=`<button class="nd ${c}${n%10===0?' bs':''}" style="left:${x}%;top:${y}%" data-n="${n}">${c==='lk'?(n%10===0?'👑':'🔒'):bn(n)}${c==='dn'?`<span class="ns">${'⭐'.repeat(sc)}${'☆'.repeat(3-sc)}</span>`:''}</button>`;
  }
  const dec=[[6,12],[88,24],[8,52],[90,62],[10,86],[86,90]].map(([a,b])=>`<span class="dec" style="left:${a}%;top:${b}%">${emo}</span>`).join('');
  P.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><polyline points="${pl}" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`+dec+h+(mw===9?'<div style="position:absolute;left:50%;top:0;transform:translateX(-50%);background:rgba(0,0,0,.35);padding:4px 12px;border-radius:14px;font-size:.8rem;font-weight:800;white-space:nowrap">'+L().soon+'</div>':'');
  P.querySelectorAll('.nd').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;if(n>maxLv){sfx.bad();return}lv=n;M.style.display='none';start()});
}
$('pv').onclick=()=>showMap(mw-1);$('nx').onclick=()=>showMap(mw+1);
$('pl').onclick=()=>{lv=Math.min(maxLv,100);$('map').style.display='none';start()};
$('ms').onclick=openSet;$('mpb').onclick=()=>showMap();$('mi').onclick=()=>openMis('d');
let sx0=0,exitArmed=false,exitT=null;
$('mp').addEventListener('touchstart',e=>{sx0=e.touches[0].clientX},{passive:true});
$('mp').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx0;if(Math.abs(d)>70){const b=d>0?$('pv'):$('nx');if(!b.disabled)b.click()}},{passive:true});
const capApp=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
function doBack(){
  const open=id=>$(id).style.display==='flex';
  if(open('stg')){$('stg').style.display='none';return true}
  if(open('mis')){$('mis').style.display='none';return true}
  if(open('m')){$('m').style.display='none';showMap(Math.floor((lv-1)/10));return true}
  if(!open('map')){showMap();return true}
  return false;
}
function armExit(){exitArmed=true;toast(L().exitHint);clearTimeout(exitT);exitT=setTimeout(()=>{exitArmed=false},2000)}
if(capApp()&&capApp().addListener){
  capApp().addListener('backButton',()=>{
    if(doBack())return;
    if(exitArmed){capApp().exitApp()}else armExit();
  });
}else{
  history.replaceState({r:1},'');history.pushState({a:1},'');
  addEventListener('popstate',()=>{
    if(doBack()){history.pushState({a:1},'');return}
    if(!exitArmed){armExit();history.pushState({a:1},'')}
  });
}
addEventListener('resize',render);
requestAnimationFrame(()=>{start();showMap();if(daily()){render();showMap();toast(L().gift(bn(50)))}});
</script>
</body>
</html>
